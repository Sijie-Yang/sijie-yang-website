    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    <style id="layout-critical-css">
      body.fixed-top-nav {
        padding-top: 56px;
      }

      .container {
        width: 100%;
        max-width: {{ site.max_width }};
        margin-left: auto;
        margin-right: auto;
        padding-left: 15px;
        padding-right: 15px;
      }

      h1.post-title {
        font-size: 2.5rem;
        font-weight: 500;
        line-height: 1.2;
        margin-top: 0;
        margin-bottom: 0.5rem;
      }

      .post-description {
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }

      .press-cover-btn {
        display: block;
        width: 11.5rem;
        height: 11.5rem;
        overflow: hidden;
      }

      .press-cover {
        width: 100%;
        height: 100%;
        max-width: 11.5rem;
        max-height: 11.5rem;
        object-fit: cover;
        display: block;
      }

      .press-item-title {
        font-size: 1.05rem;
        line-height: 1.4;
        margin: 0 0 0.4rem 0;
      }
    </style>

    {% if site.bilingual.enabled %}
    <style id="lang-critical-css">
      .lang-content[data-lang] {
        display: none !important;
      }

      html[data-site-lang="en"] .lang-content[data-lang="en"],
      html[data-site-lang="zh"] .lang-content[data-lang="zh"] {
        display: block !important;
      }

      html[data-site-lang="en"] .lang-content.lang-inline[data-lang="en"],
      html[data-site-lang="zh"] .lang-content.lang-inline[data-lang="zh"] {
        display: inline !important;
      }

      html[data-site-lang="en"] .horizon-item-title a.lang-content.lang-inline[data-lang="en"],
      html[data-site-lang="zh"] .horizon-item-title a.lang-content.lang-inline[data-lang="zh"] {
        display: inline-flex !important;
      }
    </style>
    <script>
      (function () {
        var lang = "en";
        try {
          var saved = localStorage.getItem("site-lang");
          if (saved === "zh" || saved === "en") {
            lang = saved;
          } else {
            var meta = document.querySelector('meta[name="default-lang"]');
            if (meta && meta.content === "zh") lang = "zh";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-site-lang", lang);
      })();
    </script>
    {% endif %}

    <!-- Bootstrap & MDB -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@{{ site.bootstrap.version }}/dist/css/bootstrap.min.css" rel="stylesheet" integrity="{{ site.bootstrap.integrity.css }}" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdbootstrap@{{ site.mdb.version }}/css/mdb.min.css" integrity="{{ site.mdb.integrity.css }}" crossorigin="anonymous" />

    <!-- Bootstrap Table -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@{{ site.bootstrap-table.version }}/dist/bootstrap-table.min.css" media="print" onload="this.media='all'">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{ site.fontawesome.version }}/css/all.min.css" integrity="{{ site.fontawesome.integrity }}" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@{{ site.academicons.version }}/css/academicons.min.css" integrity="{{ site.academicons.integrity }}" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Roboto+Slab:wght@300;400;700&family=Material+Icons&display=swap">

    <!-- Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jwarby/jekyll-pygments-themes@master/{{ site.highlight_theme_light | append: '.css' }}" media="" id="highlight_theme_light" />

    {% if page.toc and page.toc.sidebar %}
    <!-- Sidebar Table of Contents -->
    <link href="https://cdn.jsdelivr.net/gh/afeld/bootstrap-toc@v1.0.1/dist/bootstrap-toc.min.css" rel="stylesheet" />
    {% endif %}

    <!-- Styles -->
    {% if site.icon.size <= 4 %}
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>">
    {% elsif site.icon != blank %}
    <link rel="shortcut icon" href="{{ site.icon | prepend: '/assets/img/' | relative_url}}"/>
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url | bust_css_cache }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <!-- Dark Mode -->
    {% if site.enable_darkmode %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jwarby/jekyll-pygments-themes@master/{{ site.highlight_theme_dark | append: '.css' }}" media="none" id="highlight_theme_dark" />
    <script src="{{ '/assets/js/theme.js' | relative_url | bust_file_cache }}"></script>
    <script src="{{ '/assets/js/dark_mode.js' | relative_url | bust_file_cache }}"></script>
    {% endif %}
