intro_en: >
  Beyond academic research, I am passionate about translating innovative ideas into real-world impact
  through entrepreneurship and strategic partnerships. Here are some of the ventures and collaborations
  I've been involved in.

intro_zh: >
  除学术研究外，我也致力于将创新想法转化为真实世界的影响——通过创业与战略合作实现研究落地。
  以下是我参与的部分项目与合作。

items:
  - title: CityExperienceAI
    logo: /assets/img/partnerships/CityExperienceAI.png
    description_en: A spatial intelligence analytics company serving government (G), business (B), and consumer (C) sectors.
    description_zh: 面向政府（G）、企业（B）与消费者（C）的空间智能分析公司。

  - title: reArch Lab
    logo: /assets/img/partnerships/reArch Lab.png
    description_en: An educational consulting agency focused on helping architecture and planning students transition into AI-assisted data analysis.
    description_zh: 帮助建筑与规划学生转向 AI 辅助数据分析的教育咨询机构。

  - title: reUrban Community
    logo: /assets/img/partnerships/reUrban Community.png
    description_en: A research community focused on urban transformations in the digital age.
    description_zh: 关注数字时代城市转型的研究社群。
    link: https://www.notion.so/reUrban-Community-25e2f119ce3d80388d05f88f9daca148?source=copy_link
    link_label_en: Join Notion Community
    link_label_zh: 加入 Notion 社群

  - title: JIEnv Studio
    logo: /assets/img/partnerships/JIEnv Studio.png
    description_en: Environmental design studio specializing in sustainable architecture and urban planning solutions.
    description_zh: 专注可持续建筑与城市规划解决方案的环境设计工作室。

